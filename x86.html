<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>X86 CHICK</title>
  <style>
    #screen_container {
     width: 640px;
     height: 400px;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="https://copy.sh/v86/build/libv86.js"></script>
</head>

<body>
<div id="screen_container">
  <div style="white-space: pre; font-family: monospace;"></div>
  <canvas></canvas>
</div>

<div style="margin-top: 10px;">
  <button onclick="pauseVM()">Pause</button>
  <button onclick="resumeVM()">Resume</button>
  <button onclick="resetVM()">Reset</button>
  <button onclick="goFullscreen()">Fullscreen</button>
</div>

<script>
function pauseVM() {
  if (!window.emulator) return;
  window.emulator.stop();
}

function resumeVM() {
  if (!window.emulator) return;
  window.emulator.run();
}

function resetVM() {
  if (!window.emulator) return;

  // hard reset = full reboot
  window.emulator.restart();
}

function goFullscreen() {
  const el = document.getElementById("screen_container");

  if (el.requestFullscreen) {
    el.requestFullscreen();
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (el.mozRequestFullScreen) {
    el.mozRequestFullScreen();
  } else if (el.msRequestFullscreen) {
    el.msRequestFullscreen();
  }
}

window.onload = function () {
  window.emulator = new V86({
    wasm_path: "v86.wasm",
    screen_container: document.getElementById("screen_container"),

    bios: {
      url: "seabios.bin"
    },

    vga_bios: {
      url: "vgabios.bin"
    },

    cdrom: {
      url: "myos.iso"
    },

    autostart: true,
    disable_keyboard: false,
    disable_mouse: false
  });
  window.addEventListener("click", () => {
    if (window.emulator?.audio_context?.state === "suspended") {
      window.emulator.audio_context.resume();
    }
  }, { once: true });
};
</script>
</body>
</html>
